appId: edu.ku.catalyst.discoverycrm
productName: Catalyst Discovery CRM
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
# better-sqlite3 ships N-API prebuilds for every platform, so no native rebuild is needed.
npmRebuild: false
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    target: dmg
    arch: universal
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
publish: null
