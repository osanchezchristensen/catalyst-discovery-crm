# Builds installers on each OS when a version tag (v0.9.0, …) is pushed, then puts them in a DRAFT
# GitHub Release. A person reviews and publishes the draft. See README "Releasing" and ADR 0004.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Package installers
        run: npx electron-builder --publish never
        env:
          # Unsigned beta (ADR 0004). To sign later, add repository secrets and pass them here:
          #   CSC_LINK, CSC_KEY_PASSWORD               (Windows .pfx / macOS .p12, base64)
          #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   (macOS notarization)
          # and turn mac.hardenedRuntime back on in electron-builder.yml.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Create draft release
        # upload-artifact keeps the release/<version>/ folder, so the files arrive as installers/<version>/<file>.
        run: gh release create "$TAG" installers/*/* --draft --title "Catalyst Discovery CRM $TAG" --generate-notes --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
